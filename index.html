<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="application-name" content="Red Square 4" />
    <meta name="apple-mobile-web-app-title" content="Red Square 4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="A Mario-inspired 2D platformer. You are a red square." />
    <meta name="rs4-build" content="2026-08-19-sw-reload" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Red Square 4</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 15;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        box-sizing: border-box;
        padding: calc(clamp(24px, 7vh, 64px) + env(safe-area-inset-top, 0px))
          calc(24px + env(safe-area-inset-right, 0px))
          calc(clamp(28px, 8vh, 72px) + env(safe-area-inset-bottom, 0px))
          calc(24px + env(safe-area-inset-left, 0px));
        background: #5c94fc;
        color: #fff8f0;
        pointer-events: none;
        opacity: 1;
        transition: opacity 280ms ease;
      }
      #boot-splash.is-done {
        opacity: 0;
      }
      .boot-splash-title,
      .boot-splash-loading {
        margin: 0;
        font-family: 'Nunito', 'Trebuchet MS', sans-serif;
        font-weight: 700;
        text-align: center;
      }
      .boot-splash-title {
        font-size: clamp(32px, 8vw, 64px);
        letter-spacing: 0.04em;
        color: #ffffff;
        -webkit-text-stroke: 4px #7a1212;
        paint-order: stroke fill;
        text-shadow: 2px 2px 0 #12080a;
      }
      .boot-splash-hero {
        width: min(220px, 42vmin);
        height: auto;
      }
      .boot-splash-loading {
        font-size: clamp(18px, 3.6vh, 28px);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-shadow: 0 2px 0 #12080a;
        animation: boot-splash-pulse 1s ease-in-out infinite;
      }
      @keyframes boot-splash-pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none;
        }
        .boot-splash-loading {
          animation: none;
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <p class="boot-splash-title">RED SQUARE 4</p>
      <svg class="boot-splash-hero" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <rect x="18" y="42" width="18" height="12" rx="4" fill="#2a1814" />
        <rect x="64" y="42" width="18" height="12" rx="4" fill="#2a1814" />
        <rect x="14" y="12" width="72" height="62" rx="14" fill="#1a0808" />
        <rect x="20" y="18" width="60" height="50" rx="10" fill="#ff3d42" />
        <rect x="20" y="46" width="60" height="22" rx="10" fill="#c41c28" />
        <rect x="20" y="46" width="60" height="10" fill="#c41c28" />
        <rect x="24" y="22" width="16" height="8" rx="4" fill="#ff9aa0" />
        <ellipse cx="38" cy="40" rx="11" ry="12" fill="#1a0808" />
        <ellipse cx="62" cy="40" rx="11" ry="12" fill="#1a0808" />
        <ellipse cx="38" cy="40" rx="9" ry="10" fill="#fff" />
        <ellipse cx="62" cy="40" rx="9" ry="10" fill="#fff" />
        <ellipse cx="41" cy="41" rx="5" ry="6" fill="#140808" />
        <ellipse cx="65" cy="41" rx="5" ry="6" fill="#140808" />
        <ellipse cx="38.5" cy="37.5" rx="2" ry="2.2" fill="#fff" />
        <ellipse cx="62.5" cy="37.5" rx="2" ry="2.2" fill="#fff" />
      </svg>
      <p class="boot-splash-loading">loading...</p>
    </div>
    <div id="app"></div>

    <button type="button" id="hud-pause" class="hud-pause-btn" aria-label="Pause" aria-hidden="true">
      <span class="hud-pause-icon" aria-hidden="true"><span></span><span></span></span>
      <span class="hud-pause-label">PAUSE</span>
    </button>

    <div id="touch-controls" aria-hidden="true">
      <div class="touch-move-pad" data-touch-move aria-label="Move left or right">
        <div class="touch-slider" data-touch-slider aria-hidden="true">
          <span class="touch-slider-shell"></span>
          <svg class="touch-slider-arrow touch-slider-arrow-left" viewBox="0 0 48 48" fill="none">
            <path d="M29 10 L15 24 L29 38" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="touch-slider-groove"></span>
          <span class="touch-slider-thumb"></span>
          <svg class="touch-slider-arrow touch-slider-arrow-right" viewBox="0 0 48 48" fill="none">
            <path d="M19 10 L33 24 L19 38" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
      <div class="touch-cluster touch-cluster-right">
        <button type="button" class="touch-btn touch-btn-special is-ready" data-touch="special" aria-label="Use world power">
          <span class="touch-btn-charge" aria-hidden="true">
            <span class="touch-btn-charge-fill"></span>
          </span>
          <span class="touch-btn-ring"></span>
          <svg class="touch-btn-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M26 5 L12 27 H23 L20 43 L36 19 H25 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round" />
          </svg>
        </button>
        <button type="button" class="touch-btn" data-touch="jump" aria-label="Jump">
          <span class="touch-btn-ring"></span>
          <svg class="touch-btn-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M12 30 L24 14 L36 30" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M16 38 H32" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    <div id="rotate-prompt" role="dialog" aria-live="polite" aria-label="Rotate your device to landscape">
      <div class="rotate-card">
        <svg class="rotate-icon" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <rect x="18" y="10" width="28" height="48" rx="5" stroke="currentColor" stroke-width="2.6" />
          <path d="M46 22 L62 30 L46 38" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M24 50 H40" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
        </svg>
        <p class="rotate-title">Rotate to landscape</p>
        <p class="rotate-copy">Phones and tablets play this game sideways.</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

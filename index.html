<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="application-name" content="Red Square 4" />
    <meta name="apple-mobile-web-app-title" content="Red Square 4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="A Mario-inspired 2D platformer. You are a red square." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Red Square 4</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="touch-controls" aria-hidden="true">
      <div class="touch-cluster touch-cluster-left">
        <button type="button" class="touch-btn" data-touch="left" aria-label="Move left">
          <span class="touch-btn-ring"></span>
          <svg class="touch-btn-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M29 10 L15 24 L29 38" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button type="button" class="touch-btn" data-touch="right" aria-label="Move right">
          <span class="touch-btn-ring"></span>
          <svg class="touch-btn-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M19 10 L33 24 L19 38" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <div class="touch-cluster touch-cluster-right">
        <button type="button" class="touch-btn touch-btn-special" data-touch="special" aria-label="Use world power">
          <span class="touch-btn-ring"></span>
          <svg class="touch-btn-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M26 5 L12 27 H23 L20 43 L36 19 H25 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round" />
          </svg>
        </button>
        <button type="button" class="touch-btn" data-touch="jump" aria-label="Jump">
          <span class="touch-btn-ring"></span>
          <svg class="touch-btn-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M12 30 L24 14 L36 30" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M16 38 H32" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    <div id="rotate-prompt" role="dialog" aria-live="polite" aria-label="Rotate your device to landscape">
      <div class="rotate-card">
        <svg class="rotate-icon" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <rect x="18" y="10" width="28" height="48" rx="5" stroke="currentColor" stroke-width="2.6" />
          <path d="M46 22 L62 30 L46 38" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M24 50 H40" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
        </svg>
        <p class="rotate-title">Rotate to landscape</p>
        <p class="rotate-copy">Phones and tablets play this game sideways.</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
